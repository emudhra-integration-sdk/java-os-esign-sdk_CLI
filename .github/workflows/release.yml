name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install Apache Ant
        run: sudo apt-get update -q && sudo apt-get install -y ant

      - name: Build JAR
        run: ant jar

      - name: Verify JAR
        run: test -f dist/eSignASPLibrary5_11.jar && du -sh dist/eSignASPLibrary5_11.jar

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ steps.tag.outputs.name }}
        run: |
          VERSION_ESC=$(printf '%s' "$VERSION" | sed 's/[.]/\\./g')
          awk "/^## .*${VERSION_ESC}/{f=1;next} f&&/^## /{exit} f{print}" CHANGELOG.md \
            > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "See commit history for changes in this release." > release_notes.md
          fi

      - name: Create tag (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "${{ steps.tag.outputs.name }}" || true
          git push origin "${{ steps.tag.outputs.name }}" || true

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.name }}" \
            --title "eSign CLI ${{ steps.tag.outputs.name }}" \
            --notes-file release_notes.md \
            dist/eSignASPLibrary5_11.jar
