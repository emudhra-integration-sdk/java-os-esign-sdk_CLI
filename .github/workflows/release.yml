name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install Apache Ant
        run: sudo apt-get update -q && sudo apt-get install -y ant

      - name: Build JAR
        run: ant jar

      - name: Verify build
        run: |
          test -f dist/eSignASPLibrary5_10.jar \
            && echo "JAR built: $(du -sh dist/eSignASPLibrary5_10.jar | cut -f1)" \
            || (echo "Build failed — JAR not found" && exit 1)

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          VERSION="${{ steps.tag.outputs.TAG }}"
          ESCAPED="${VERSION//./\\.}"

          NOTES=$(awk "
            /^## \[?${ESCAPED}\]?/ { found=1; next }
            found && /^## \[?v[0-9]/ { exit }
            found { print }
          " CHANGELOG.md)

          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV" ]; then
              NOTES=$(git log --pretty=format:"- %s" "${PREV}..HEAD")
            else
              NOTES=$(git log --pretty=format:"- %s" HEAD)
            fi
          fi

          {
            echo "NOTES<<EOF"
            printf '%s\n' "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.TAG }}"
          NOTES="${{ steps.changelog.outputs.NOTES }}"

          BODY="## eSign Java SDK CLI — ${TAG}

          ${NOTES}

          ---

          ### Installation

          1. Download \`eSignASPLibrary5_10.jar\` from the assets below.
          2. Place it in \`dist/\` alongside the \`lib/\` directory and launcher scripts.
          3. Linux/macOS: \`chmod +x esign-cli.sh\`
          4. Call from PHP: \`shell_exec('/opt/esign/esign-cli.sh request.json')\`

          **Requirements:** Java 11+

          See [CLI_GUIDE.md](https://github.com/${GITHUB_REPOSITORY}/blob/master/documentation/CLI_GUIDE.md) for full documentation."

          # Create tag if triggered manually
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git tag "${TAG}" || true
            git push origin "${TAG}" || true
          fi

          gh release create "${TAG}" \
            --title "eSign CLI ${TAG}" \
            --notes "${BODY}" \
            dist/eSignASPLibrary5_10.jar
